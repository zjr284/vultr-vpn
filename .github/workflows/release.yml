name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 打包
        run: |
          mkdir -p dist
          tar --exclude=.git --exclude=dist \
              -czf "dist/vultr-vpn-${GITHUB_REF_NAME}.tar.gz" .
          cd dist
          sha256sum "vultr-vpn-${GITHUB_REF_NAME}.tar.gz" > SHA256SUMS
          cat SHA256SUMS

      # 从 CHANGELOG.md 抽出当前 tag 对应的小节（## [vX.Y.Z] ... 到下一个 ## [ 之前）
      # 抽出为空时回退到 GitHub 自动生成的英文 notes
      - name: 提取 CHANGELOG 片段
        id: notes
        run: |
          TAG="${GITHUB_REF_NAME}"
          : > /tmp/notes.md
          if [ -f CHANGELOG.md ]; then
            awk -v tag="$TAG" '
              $0 ~ "^## \\[" tag "\\]" { flag = 1; next }
              /^## \[/ && flag { exit }
              flag { print }
            ' CHANGELOG.md | sed '/./,$!d' > /tmp/notes.md
          fi
          if [ -s /tmp/notes.md ]; then
            echo "has=true" >> "$GITHUB_OUTPUT"
            echo "找到 $TAG 的 CHANGELOG 小节（$(wc -l < /tmp/notes.md) 行）"
          else
            echo "has=false" >> "$GITHUB_OUTPUT"
            echo "CHANGELOG.md 里没有 $TAG，回退到自动生成的 notes"
          fi

      - name: 创建 Release（中文说明）
        if: steps.notes.outputs.has == 'true'
        uses: softprops/action-gh-release@v2
        with:
          body_path: /tmp/notes.md
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS

      - name: 创建 Release（自动生成说明）
        if: steps.notes.outputs.has != 'true'
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS
